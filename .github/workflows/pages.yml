# GitHub Pages 배포. 빌드 직전에 기여 달력 JSON 을 받아 넣는다(커밋하지 않음).
# 저장소가 비공개인 동안은 전부 건너뛴다 — 공개 전환 + Pages 활성화(Settings → Pages → Source: GitHub Actions) 뒤에 돈다.
# CONTRIB_TOKEN이 없으면 검증된 스냅샷을 유지한다. 기본 Actions 토큰은 비공개 활동을 볼 수 없다.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *' # 매일 03:00 KST — 기여 달력 갱신
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 기여 달력 JSON
        env:
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
        run: |
          if [ -n "$CONTRIB_TOKEN" ]; then
            GITHUB_TOKEN="$CONTRIB_TOKEN" node scripts/fetch-contributions.mjs
          else
            echo "CONTRIB_TOKEN not configured; preserving the reviewed contributions snapshot."
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
