# GitHub Pages 배포. 빌드 직전에 기여 달력 JSON 을 받아 넣는다(커밋하지 않음).
# 저장소가 비공개인 동안은 전부 건너뛴다 — 공개 전환 + Pages 활성화(Settings → Pages → Source: GitHub Actions) 뒤에 돈다.
# 비공개 기여 개수가 빠지면 Secrets 에 classic PAT(read:user) 를 CONTRIB_TOKEN 으로 넣는다.
name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *' # 매일 03:00 KST — 기여 달력 갱신
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 기여 달력 JSON
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-contributions.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
